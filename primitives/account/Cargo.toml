[package]
name = "fp-account"
version = "1.0.0-dev"
license = "Apache-2.0"
description = "Primitives for Frontier AccountId20."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[dependencies]
hex = { workspace = true }
impl-serde = { workspace = true, optional = true }
libsecp256k1 = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true, optional = true }

# Substrate
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

# Polkadot / XCM
xcm = { workspace = true }

# BlackChain PQC verification. `fp-blackchain-crypto` is the std-only native path;
# `pallet-ethereum-blackchain-hf` is the WASM path (no_std extern stub → host fn),
# exactly as pallet-blackchain-sudo wires them.
fp-blackchain-crypto = { workspace = true, optional = true }
pallet-ethereum-blackchain-hf = { workspace = true, default-features = false }

[dev-dependencies]
blackchain-crypto-lib-rust = { git = "https://github.com/Tycoonz-Solutions/blackchain-crypto-lib-rust-fixed.git", tag = "v0.1.1" }

[features]
default = ["std"]
std = [
	"hex/std",
	"impl-serde/std",
	"libsecp256k1/std",
	"scale-codec/std",
	"scale-info/std",
	"serde/std",
	# Substrate
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"xcm/std",
	# BlackChain PQC
	"fp-blackchain-crypto",
	"fp-blackchain-crypto/std",
	"pallet-ethereum-blackchain-hf/std",
]
serde = [
	"dep:serde",
	"impl-serde",
	"scale-info/serde",
	"sp-core/serde",
	"sp-runtime/serde",
]
