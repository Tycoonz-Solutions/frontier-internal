[package]
name = "fp-blackchain-rpc"
version = "0.1.0"
license = "Apache-2.0"
description = "Runtime API exposing BlackChain PQC transaction data (ethereum hash, sender, composite public key + signature) to the node RPC layer."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
sp-api = { workspace = true }
sp-core = { workspace = true }

[features]
default = ["std"]
std = [
	"sp-api/std",
	"sp-core/std",
]
